<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Report - Kab Tak</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Upload Stylesheet -->
  <link rel="stylesheet" href="style/upload.css">
</head>
<body class="bg-light">

  <!-- Header -->
  <header class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <i class="bi bi-clock-history text-warning"></i>
        <span>Kab Tak</span>
      </a>
      <span class="navbar-text ms-auto text-light small d-none d-sm-inline">
        <i class="bi bi-shield-lock-fill text-warning me-1"></i> Admin Portal
      </span>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="kt-upload-hero">
    <div class="container kt-upload-hero-content">
      <div class="kt-upload-icon-circle mb-3">
        <i class="bi bi-cloud-arrow-up-fill"></i>
      </div>
      <h1 class="h3 fw-bold mb-2">Upload Monthly Report</h1>
      <p class="text-light opacity-75 mb-0 max-w-600 mx-auto">
        Select the reporting period and attach the official PDF document.
      </p>
    </div>
  </section>

  <!-- Form Section -->
  <main class="kt-upload-section pb-5" id="upload-content" hidden>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          
          <div class="card kt-upload-card border-0 shadow-lg">
            <div class="card-body p-4 p-md-5">

              <!-- Alert Banner -->
              <div id="upload-alert" role="alert" hidden></div>

              <!-- Upload Form -->
              <form id="upload-form" novalidate enctype="multipart/form-data">

                <!-- Input 1: Reporting Month & Year -->
                <div class="mb-4">
                  <label for="reporting_month" class="form-label fw-semibold">
                    <i class="bi bi-calendar-month me-1 text-primary"></i> Reporting Month & Year <span class="text-danger">*</span>
                  </label>
                  <input type="month" class="form-control form-control-lg" id="reporting_month" name="reporting_month" required>
                  <div class="invalid-feedback">Please select a valid month and year.</div>
                </div>

                <!-- Input 2: PDF Document File -->
                <div class="mb-4">
                  <label for="document" class="form-label fw-semibold">
                    <i class="bi bi-file-earmark-pdf me-1 text-danger"></i> PDF Document <span class="text-danger">*</span>
                  </label>
                  <input type="file" class="form-control form-control-lg" id="document" name="document" accept=".pdf,application/pdf" required>
                  <div class="form-text">Only standard .pdf files under 20 MB are accepted.</div>
                  <div class="invalid-feedback">Please upload a valid PDF file.</div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                  <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold kt-upload-submit">
                    <i class="bi bi-upload me-1"></i> Upload Report
                  </button>
                </div>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 bg-white border-top text-center text-muted small">
    <div class="container">
      <span>&copy; 2026 Kab Tak Infrastructure Accountability Portal.</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/upload.js"></script>
</body>
</html>
