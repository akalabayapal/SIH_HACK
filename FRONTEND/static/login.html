<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kab Tak</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <a href="#main-content" class="visually-hidden-focusable kt-skip-link">Skip to main content</a>

  <nav class="navbar navbar-expand-lg fixed-top kt-navbar" data-bs-theme="dark" aria-label="Main navigation">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand me-4" href="index.html" aria-label="Kab Tak home">
        <span class="kt-logo-slot">Logo</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="a.html">A</a></li>
          <li class="nav-item"><a class="nav-link" href="b.html">B</a></li>
          <li class="nav-item"><a class="nav-link" href="c.html">C</a></li>
        </ul>
        <a class="btn btn-light btn-sm px-3 fw-semibold" href="login.html" aria-current="page">Login</a>
      </div>
    </div>
  </nav>

  <main id="main-content" tabindex="-1">
    <section class="kt-hero kt-hero--compact">
      <div class="container"><h1 class="h2 mb-0">Login</h1></div>
    </section>

    <section class="py-5">
      <div class="container">
        <div class="row">
          <div class="col-md-7 col-lg-5 mx-auto">
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <form id="login-form" novalidate>
                  <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
                    <div class="invalid-feedback">Enter your username.</div>
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    <div class="invalid-feedback">Enter your password.</div>
                  </div>
                  <div id="login-message" class="alert d-none" role="alert"></div>
                  <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="kt-footer text-white py-4 mt-auto">
    <div class="container text-center small">
      <p class="mb-1">Kab Tak | Ministry of Statistics and Programme Implementation, Government of India</p>
      <p class="mb-0 opacity-75">Built for Smart India Hackathon, problem statement 26103</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="brain.js"></script>
</body>
</html>
